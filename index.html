<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operasi Kantin Sihat 2.0 - Game Interaktif BM Tahun 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; background: #0f172a; user-select: none; }
        .font-game { font-family: 'Fredoka One', cursive; }
        
        /* Interactive Card Styling */
        .draggable-card {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .draggable-card:active { cursor: grabbing; transform: scale(1.05); }
        .drop-zone {
            transition: all 0.3s border-color, background-color;
        }
        .drop-zone.hovered {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        /* Detective Magnifying Effect */
        .magnifier-target {
            transition: filter 0.3s;
        }
        .magnifier-target:hover {
            filter: drop-shadow(0 0 10px #f59e0b);
            transform: scale(1.1);
        }

        /* 3D Button Bounce */
        .btn-game {
            box-shadow: 0 6px 0 #1e293b;
            transition: all 0.1s;
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e293b;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 sm:p-4">

    <div class="relative w-full max-w-5xl h-full max-h-[750px] bg-slate-800 rounded-3xl border-8 border-amber-400 shadow-2xl flex flex-col justify-between overflow-hidden">
        
        <!-- HEADER / STATUS -->
        <header class="bg-slate-900 p-4 text-white flex justify-between items-center border-b-4 border-slate-700">
            <div class="flex items-center space-x-3">
                <span class="text-3xl animate-bounce">⚡</span>
                <div>
                    <h1 class="font-game text-2xl text-amber-400">OPERASI KANTIN SIHAT 2.0</h1>
                    <p class="text-xs text-slate-300 font-bold">Pengembaraan Ejen Interaktif • BM Tahun 4</p>
                </div>
            </div>
            
            <div class="w-48 bg-slate-950 p-2 rounded-2xl border border-slate-700">
                <div class="flex justify-between text-xs font-black mb-1">
                    <span class="text-amber-400">METER KANTIN</span>
                    <span id="meter-text" class="text-white">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                    <div id="meter-bar" class="bg-gradient-to-r from-amber-400 to-green-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </header>

        <!-- MAIN INTERACTIVE CONTAINER -->
        <main id="app-content" class="flex-1 relative flex flex-col items-center justify-center p-4 overflow-hidden bg-slate-900/50">
            <!-- Content loaded via JS -->
        </main>

        <!-- FOOTER -->
        <footer class="bg-slate-900 p-3 border-t-4 border-slate-700 flex justify-between items-center">
            <button onclick="showMenu()" class="bg-slate-700 hover:bg-slate-600 text-white font-black py-2 px-4 rounded-xl text-xs btn-game">
                🏠 Menu Utama
            </button>
            <div class="text-xs text-slate-400 font-bold">
                Mod Interaktif Bilik Darjah • Kemahiran Mendengar & Bertutur
            </div>
        </footer>
    </div>

    <script>
        // Sound Synthesis
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, duration, type='sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ms-MY';
                u.rate = 0.95;
                window.speechSynthesis.speak(u);
            }
        }

        let state = { progress: 0, m1Completed: false, m2Completed: false, m3Completed: false, m2Found: [] };

        function updateProgress(val) {
            state.progress = val;
            document.getElementById('meter-bar').style.width = val + '%';
            document.getElementById('meter-text').innerText = val + '%';
        }

        function showMenu() {
            playSfx(440, 0.1);
            const main = document.getElementById('app-content');
            main.innerHTML = `
                <div class="text-center space-y-6 max-w-lg">
                    <div class="flex justify-center space-x-6">
                        <div class="bg-blue-600 p-4 rounded-full border-4 border-white shadow-xl text-4xl animate-pulse">👦</div>
                        <div class="bg-pink-600 p-4 rounded-full border-4 border-white shadow-xl text-4xl animate-pulse">👧</div>
                    </div>
                    <h2 class="font-game text-3xl text-white">Sertai Ejen Hadif & Deena!</h2>
                    <p class="text-slate-300 text-sm font-bold">Lengkapkan 3 Misi Interaktif untuk Menyelamatkan Kantin Sekolah Kita!</p>
                    
                    <div class="space-y-3">
                        <button onclick="startMisi1()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-game py-4 px-6 rounded-2xl text-xl btn-game flex justify-between items-center border-2 border-white">
                            <span>🎮 MISI 1: SERET & PADAN (SUARA)</span>
                            <span class="text-xs bg-black/30 px-3 py-1 rounded-full">${state.m1Completed ? '✓ SELESAI' : 'MULA'}</span>
                        </button>

                        <button onclick="${state.m1Completed ? 'startMisi2()' : 'alert(\'Selesaikan Misi 1 dahulu!\')'}" class="w-full ${state.m1Completed ? 'bg-blue-500 hover:bg-blue-400' : 'bg-slate-700 opacity-50'} text-white font-game py-4 px-6 rounded-2xl text-xl btn-game flex justify-between items-center border-2 border-white">
                            <span>🔍 MISI 2: KANTA DETEKTIF KANTIN</span>
                            <span class="text-xs bg-black/30 px-3 py-1 rounded-full">${state.m2Completed ? '✓ SELESAI' : '🔒 KUNCI'}</span>
                        </button>

                        <button onclick="${state.m2Completed ? 'startMisi3()' : 'alert(\'Selesaikan Misi 2 dahulu!\')'}" class="w-full ${state.m2Completed ? 'bg-amber-500 hover:bg-amber-400' : 'bg-slate-700 opacity-50'} text-white font-game py-4 px-6 rounded-2xl text-xl btn-game flex justify-between items-center border-2 border-white">
                            <span>🎡 MISI 3: RODA CABARAN 3D</span>
                            <span class="text-xs bg-black/30 px-3 py-1 rounded-full">${state.m3Completed ? '✓ SELESAI' : '🔒 KUNCI'}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // MISI 1: INTERAKTIF DRAG AND DROP
        // ==========================================
        const m1Questions = [
            { text: "Hadif: 'Banyaknya sampah di bawah meja. Apa patut kita buat?'", ans: "Mari kita kutip sampah dan buang ke dalam tong.", wrong: ["Biarkan sahaja.", "Bukan kita yang kotorkan."] },
            { text: "Deena: 'Tangan awak kotor selepas bermain. Awak nak terus makan?'", ans: "Saya cuci tangan dahulu sebelum makan.", wrong: ["Ya, tidak mengapa.", "Saya lap pada baju sahaja."] }
        ];
        let m1Idx = 0;

        function startMisi1() {
            playSfx(523, 0.1);
            const q = m1Questions[m1Idx];
            const choices = [q.ans, ...q.wrong].sort(() => Math.random() - 0.5);

            const main = document.getElementById('app-content');
            main.innerHTML = `
                <div class="w-full max-w-2xl text-center space-y-4">
                    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500 px-3 py-1 rounded-full text-xs font-black">MISI 1: DRAG & DROP</span>
                    
                    <!-- AUDIO TRIGGER -->
                    <div class="bg-slate-800 p-4 rounded-2xl border-2 border-emerald-400 flex items-center justify-between">
                        <div class="text-left">
                            <p class="text-xs text-emerald-400 font-bold">DENGAR SITUASI:</p>
                            <p class="text-white font-bold text-sm sm:text-base">${q.text}</p>
                        </div>
                        <button onclick="speak('${q.text}')" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-black p-3 rounded-xl text-xl">🔊</button>
                    </div>

                    <!-- DROP ZONE -->
                    <div id="drop-zone" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="handleDrop(event)" class="drop-zone border-4 border-dashed border-slate-600 rounded-3xl p-6 bg-slate-950/50 flex flex-col items-center justify-center min-h-[120px]">
                        <span class="text-3xl">📥</span>
                        <p class="text-slate-400 font-bold text-xs mt-1">SERET JAWAPAN YANG BETUL KE SINI</p>
                    </div>

                    <!-- DRAGGABLE CARDS -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${choices.map((c, i) => `
                            <div id="card-${i}" draggable="true" ondragstart="drag(event, '${c === q.ans}')" class="draggable-card bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-2xl font-bold text-xs flex items-center justify-center border-2 border-white shadow-lg">
                                ${c}
                            </div>
                        `).join('')}
                    </div>

                    <p id="m1-feedback" class="h-6 font-bold text-sm text-amber-400"></p>
                </div>
            `;
            speak(q.text);
        }

        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('hovered'); }
        function leaveDrop(e) { e.currentTarget.classList.remove('hovered'); }
        function drag(e, isCorrect) { e.dataTransfer.setData("isCorrect", isCorrect); }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('hovered');
            const isCorrect = e.dataTransfer.getData("isCorrect") === "true";
            const fb = document.getElementById('m1-feedback');

            if (isCorrect) {
                playSfx(600, 0.2);
                fb.innerText = "✨ TEPAT SEKALI! Tindakan yang amat bersih!";
                setTimeout(() => {
                    m1Idx++;
                    if (m1Idx < m1Questions.length) {
                        startMisi1();
                    } else {
                        state.m1Completed = true;
                        updateProgress(33);
                        confetti();
                        showMenu();
                    }
                }, 1200);
            } else {
                playSfx(150, 0.3, 'sawtooth');
                fb.innerText = "❌ Kurang tepat. Cuba seret jawapan yang lebih bersih!";
            }
        }

        // ==========================================
        // MISI 2: INTERAKTIF KANTA DETEKTIF
        // ==========================================
        function startMisi2() {
            playSfx(523, 0.1);
            const main = document.getElementById('app-content');
            main.innerHTML = `
                <div class="w-full max-w-2xl text-center space-y-3">
                    <span class="bg-blue-500/20 text-blue-400 border border-blue-500 px-3 py-1 rounded-full text-xs font-black">MISI 2: DETEKTIF KANTA PEMBESAR</span>
                    <h2 class="font-game text-xl text-white">Gerakkan Tetikus/Jari untuk Cari 3 Masalah Kebersihan!</h2>

                    <div class="relative w-full h-64 bg-slate-950 rounded-3xl border-4 border-blue-400 overflow-hidden flex items-center justify-around p-4">
                        <div class="absolute inset-0 bg-blue-900/10 pointer-events-none"></div>

                        <!-- PROBLEM 1 -->
                        <div onclick="inspectProblem(1, 'Sampah Bertaburan', 'Keadaan ini kotor dan boleh menarik lalat serta kuman.')" class="magnifier-target cursor-pointer p-3 bg-red-500/20 border-2 border-red-500 rounded-2xl text-center">
                            <span class="text-4xl">🗑️</span>
                            <span class="block text-[10px] font-black text-red-400 mt-1">Sampah Lantai</span>
                        </div>

                        <!-- DECOY -->
                        <div class="p-3 bg-green-500/10 border border-green-500/30 rounded-2xl text-center opacity-50">
                            <span class="text-4xl">🚰</span>
                            <span class="block text-[10px] font-bold text-green-400 mt-1">Singki Bersih</span>
                        </div>

                        <!-- PROBLEM 2 -->
                        <div onclick="inspectProblem(2, 'Makanan Terdedah', 'Makanan yang tidak ditutup mudah dicemari habuk dan lalat.')" class="magnifier-target cursor-pointer p-3 bg-red-500/20 border-2 border-red-500 rounded-2xl text-center">
                            <span class="text-4xl">🪰</span>
                            <span class="block text-[10px] font-black text-red-400 mt-1">Lalat pada Makanan</span>
                        </div>

                        <!-- PROBLEM 3 -->
                        <div onclick="inspectProblem(3, 'Tangan Kotor', 'Makan dengan tangan kotor menyebabkan sakit perut.')" class="magnifier-target cursor-pointer p-3 bg-red-500/20 border-2 border-red-500 rounded-2xl text-center">
                            <span class="text-4xl">🖐️</span>
                            <span class="block text-[10px] font-black text-red-400 mt-1">Makan Tanpa Cuci</span>
                        </div>
                    </div>

                    <div id="m2-status" class="text-xs font-bold text-slate-300">
                        Masalah Ditemui: ${state.m2Found.length} / 3
                    </div>
                </div>
            `;
        }

        function inspectProblem(id, title, desc) {
            playSfx(700, 0.15);
            if (!state.m2Found.includes(id)) state.m2Found.push(id);

            alert(`🔍 SIASATAN DETEKTIF:\n\nMasalah: ${title}\nSebab: ${desc}\n\n👉 Tugasan Lisan: Guru minta murid terangkan cara selesaikan masalah ini secara lisan!`);

            if (state.m2Found.length >= 3) {
                state.m2Completed = true;
                updateProgress(66);
                confetti();
                showMenu();
            } else {
                startMisi2();
            }
        }

        // ==========================================
        // MISI 3: RODA CABARAN 3D
        // ==========================================
        function startMisi3() {
            playSfx(523, 0.1);
            const main = document.getElementById('app-content');
            main.innerHTML = `
                <div class="w-full max-w-md text-center space-y-4">
                    <span class="bg-amber-500/20 text-amber-400 border border-amber-500 px-3 py-1 rounded-full text-xs font-black">MISI 3: RODA CABARAN</span>
                    
                    <div class="relative w-48 h-48 mx-auto rounded-full border-8 border-amber-400 bg-amber-500 flex items-center justify-center shadow-2xl animate-spin-slow">
                        <span class="text-5xl">🎡</span>
                    </div>

                    <button onclick="spinWheel3D()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-game py-4 rounded-2xl text-xl btn-game border-2 border-white">
                        🎲 PUTAR RODA CABARAN!
                    </button>
                </div>
            `;
        }

        function spinWheel3D() {
            playSfx(800, 0.3);
            setTimeout(() => {
                state.m3Completed = true;
                updateProgress(100);
                confetti({ particleCount: 200, spread: 100 });
                
                const main = document.getElementById('app-content');
                main.innerHTML = `
                    <div class="text-center space-y-4 max-w-md">
                        <div class="text-6xl animate-bounce">🏆</div>
                        <h2 class="font-game text-3xl text-emerald-400">TAHNIAH! MISI LENGKAP!</h2>
                        <p class="text-slate-300 font-bold text-sm">Murid telah berjaya menguasai Kemahiran Mendengar & Bertutur bagi Operasi Kantin Sihat!</p>
                        <button onclick="showMenu()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-game py-3 px-8 rounded-2xl text-lg btn-game border-2 border-white">
                            🏠 KEMBALI KE MENU
                        </button>
                    </div>
                `;
            }, 1000);
        }

        window.onload = showMenu;
    </script>
</body>
</html>
